<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quản lý hồ sơ, sổ địa chỉ và mật khẩu tại Jewels.">
  <title>Tài khoản của tôi - Jewels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Upright:wght@300;400;500;600;700&family=Sofia+Sans:wght@300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/store.css">
</head>
<body data-page="user">
  <header id="site-header"></header>
  <main>
    <div class="page-head"><div class="container"><p class="eyebrow">Không gian của bạn</p><h1 id="hello">Tài khoản của tôi</h1></div></div>
    <div class="container" style="max-width:860px;padding-bottom:70px" id="userRoot"></div>
  </main>
  <dialog class="dlg-narrow" id="addrDialog">
    <button class="dlg-close" type="button" data-close aria-label="Đóng">×</button>
    <form class="dlg-body form-grid" id="addrForm">
      <h3 class="wide" id="addrTitle">Thêm địa chỉ</h3>
      <label class="field">Người nhận<input name="recipient_name" required></label>
      <label class="field">Số điện thoại<input name="phone" type="tel" maxlength="10" inputmode="numeric" placeholder="0901234567" required></label>
      <label class="field wide">Địa chỉ<input name="address_line" required placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành"></label>
      <label class="wide"><input type="checkbox" name="is_default"> Đặt làm địa chỉ mặc định</label>
      <div class="wide"><button class="btn gold" type="submit">Lưu địa chỉ</button><p class="feedback" id="addrFb"></p></div>
    </form>
  </dialog>
  <footer id="site-footer"></footer>
  <script src="js/app.js"></script>
  <script src="js/pages/user.js"></script>
</body>
</html>
